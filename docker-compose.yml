version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: babypoint-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: babypoint
      POSTGRES_PASSWORD: babypoint_dev_password
      POSTGRES_DB: babypoint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babypoint"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
